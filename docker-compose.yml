services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./application-code/backend
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/snake
      ALLOWED_ORIGIN: http://localhost:8080
    depends_on:
      - mongo
    ports:
      - "3001:3001"

  frontend:
    build: ./application-code/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  mongo-data:

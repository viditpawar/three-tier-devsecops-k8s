apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend-alerts
  namespace: monitoring
spec:
  groups:
    - name: snake-backend
      rules:
        - alert: BackendDown
          expr: sum(up{job="backend", namespace="three-tier"}) == 0 or absent(up{job="backend", namespace="three-tier"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: No backend pods are being scraped successfully
        - alert: BackendHighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="three-tier", status_code=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count{namespace="three-tier"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of backend requests are returning 5xx
        - alert: BackendHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="three-tier"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Backend p95 latency is above 1s

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snake-three-tier
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/viditpawar/three-tier-devsecops-k8s.git
    targetRevision: main
    path: kubernetes-manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: three-tier
  # Sync is manual, not automated: Jenkins deploys the actual image tags
  # imperatively (kubectl set image) after each build, since there is no
  # container registry in this local setup for git to track image digests.
  # Automated sync would reapply the placeholder ":local" tags in git on
  # every push to main and clobber Jenkins' live deploy. Trigger a sync
  # from the ArgoCD UI/CLI when the baseline manifests themselves change
  # (namespace, services, ingress, configmaps, etc).
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
